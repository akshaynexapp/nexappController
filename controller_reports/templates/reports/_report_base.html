<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ title }} — {{ org.name }}</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 24px; }
    header, footer { position: fixed; left: 0; right: 0; color: #555; }
    header { top: 0; border-bottom: 1px solid #e5e7eb; padding: 8px 24px; }
    footer { bottom: 0; border-top: 1px solid #e5e7eb; padding: 8px 24px; font-size: 12px; }
    .logo { height: 24px; vertical-align: middle; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin: 16px 0 8px; }
    .kpi { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
    .kpi .label { font-size: 12px; color:#6b7280; }
    .kpi .value { font-size: 18px; font-weight: 700; }
    h1 { margin: 56px 0 8px; font-size: 22px; }
    h2 { margin: 18px 0 8px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #e5e7eb; padding: 6px 8px; }
    th { background: #f9fafb; text-align: left; }
    .note { color: #6b7280; font-size: 12px; }
    .chart { height: 220px; border: 1px dashed #d1d5db; border-radius: 8px; display:flex; align-items:center; justify-content:center; color:#9ca3af; }
    .section { page-break-inside: avoid; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header>
    <span style="margin-left:8px;">{{ org.name }} — {{ title }}</span>
    <span style="float:right;">{{ period.start }} → {{ period.end }} ({{ timezone }})</span>
  </header>

  <footer>
    Generated: {{ generated_at }} • Filters: {{ filters_summary }} • Page {{ page_number }} / {{ page_count }}
  </footer>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
