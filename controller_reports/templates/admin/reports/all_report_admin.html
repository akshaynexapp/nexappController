{% extends "admin/base_site.html" %} {% block content %}
<!-- <h1>Reports Dashboard</h1> -->
<style>
  #dashboard-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 40px;
        border: 1px solid #e9e9e9;
    font-family: Arial, sans-serif;
    border-radius: 8px;
      box-shadow: 0px 1px 1px 0px #dbdbdb;
  }
  #dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 30px;
  }
  @media (max-width: 1100px) {
    #dashboard-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
  @media (max-width: 800px) {
    #dashboard-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 520px) {
    #dashboard-grid {
      grid-template-columns: 1fr;
    }
  }
  .dashboard-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
    border: 1px solid #eef2f7;
  }
  .dashboard-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06), 0 10px 20px rgba(0, 0, 0, 0.06);
    border-color: #e5e7eb;
  }
  .dashboard-icon {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #eef2ff;
  }
  .dashboard-name {
    font-weight: 600;
  }
  .dashboard-meta {
    font-size: 12px;
    color: #6b7280;
    margin-top: 2px;
  }
  .dashboard-vstack {
    display: flex;
    flex-direction: column;
  }
  a.card-link {
    min-height: 70px;
    max-height: 100px;
    color: inherit;
    text-decoration: none;
  }
</style>

{% include "reports/_all_report_body.html" %} {% endblock %}
