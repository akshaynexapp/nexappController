{# templates/admin/config/device/sdlan_content.html #}
<div class="module aligned" id="sdlan-remote">
    <h2>{% trans "SDLAN Remote" %}</h2>
    <div id="sdlan-status" style="margin-bottom:1em;"></div>
    <button id="sdlan-init" class="button">Initialize SDLAN</button>
  </div>
  <script>
  (function($) {
    const API_HOST = 'http://8.220.247.103:30002';
    let clientId = null;
    let tunnelInfo = null;
    const mac = '{{ original.mac_address }}';
  
    function log(msg) {
      $('#sdlan-status').append('<div>' + msg + '</div>');
    }
    function apiGet(path, params) {
      return $.ajax({
        url: API_HOST + path,
        method: 'GET',
        data: params,
        dataType: 'json',
        xhrFields: { withCredentials: true }
      });
    }
    function apiPost(path, params) {
      return $.ajax({
        url: API_HOST + path,
        method: 'POST',
        data: params,
        dataType: 'json',
        xhrFields: { withCredentials: true }
      });
    }
  
    $('#sdlan-init').on('click', function(e) {
      e.preventDefault();
      log('🔄 Logging in...');
      apiGet('/login/verify', { username: 'admin', password: 'admin' })
        .then(resp => {
          if (resp.status !== 1) throw 'Login failed';
          log('✅ Logged in');
          return apiGet('/client/list', { search: mac, order: 'asc', limit: 1 });
        })
        .then(resp => {
          if (resp.data && resp.data.length) {
            clientId = resp.data[0].id;
            log('✔️ Client exists (ID ' + clientId + ')');
            return clientId;
          }
          log('➕ Creating client...');
          return apiPost('/client/add', { vkey: mac, config_conn_allow: 1 })
            .then(r => {
              clientId = r.data.id;
              log('✅ Client created (ID ' + clientId + ')');
              return clientId;
            });
        })
        .then(cid => {
          const port = 8022;
          log('🔍 Checking tunnel for port ' + port + '...');
          return apiGet('/index/gettunnel', { limit: 10, client_id: cid, search: port });
        })
        .then(resp => {
          const port = 8022;
          if (resp.data && resp.data.length) {
            tunnelInfo = resp.data[0];
            log('✔️ Tunnel exists (public port ' + tunnelInfo.port + ')');
          } else {
            log('➕ Creating tunnel...');
            // choose a free public port (for demo, hardcoded 30014)
            const publicPort = 30014;
            return apiPost('/index/add', {
              type: 'tcp',
              client_id: clientId,
              remark: port,
              server_ip: '0.0.0.0',
              port: publicPort,
              target: port
            }).then(r => {
              tunnelInfo = r.data;
              log('✅ Tunnel created (public port ' + tunnelInfo.port + ')');
            });
          }
        })
        .catch(err => {
          console.error(err);
          log('❌ Error: ' + err);
        });
    });
  })(django.jQuery);
  </script>
